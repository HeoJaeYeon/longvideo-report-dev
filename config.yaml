# report_framework 설정 — Video-MME long-video 보고서 PoC
# 사용처: prebuild_episodic_index.py (오프라인 episodic 사전 인덱싱), local_llm_server.py (로컬 LLM 엔드포인트)
# 실행 환경: /opt/venv (컨테이너 기본 venv; worldmm/hipporag/merit editable + Deep-Reporter deps 포함)
# 경로 값 규칙 (rf_config.load_config, 2026-11-10): 상대 경로 = report_framework/ 기준(설정 파일 위치가 아님),
#   ${VAR} = 환경변수(정의 안 되어 있으면 오류), 절대 경로 = 그대로. 모든 진입점이 이 규칙으로 읽는다.
#   기본값은 VideoRAG/{WorldMM, Deep-Report, report_framework}가 같은 층에 있는 배치를 가정한다.
#   WorldMM을 다른 곳에 두었다면 값을 바꾸거나 `${WORLDMM_DIR}/...`처럼 쓴다(컨테이너는 WORLDMM_DIR을 설정해 둠).

paths:
  worldmm_root: ../WorldMM                     # WorldMM checkout (캡션의 video_path가 이 경로 기준 상대 경로)
  # [기기별 설정] 모델 캐시. 스크립트가 HF_HOME을 이 값으로 설정한다. 단 HUGGINGFACE_HUB_CACHE가 설정돼 있으면
  # (videorag_report 컨테이너는 <VideoRAG>/.cache/huggingface/hub) 모델은 그 경로에서 읽힌다(I4). 자기 환경에 맞게 바꾼다.
  hf_home: ../../.cache/huggingface           # 이 서버: VideoRAG의 상위(workspace) 폴더의 .cache/huggingface
  # WorldMM 메모리 (50영상, 구축 완료). 폴더 설명: 그 폴더의 README.md·MANIFEST.json
  # (2026-11-10 WorldMM/claude_output/full/ 에서 이전. 다시 만들기: scripts/memory_build/)
  caption_dir: ../WorldMM/output/memory/videomme_long_qwen3vl-8b/caption
  metadata_dir: ../WorldMM/output/memory/videomme_long_qwen3vl-8b/metadata
  # HippoRAG 영구 캐시(prebuild_episodic_index.py가 만듦, WorldMM 원본 산출물 아님):
  #   {episodic_cache_root}/{video_id}/episodic_memory/{granularity}/ (영상당 ~25MB). 2026-11-10 cache/episodic/ 에서 이전.
  episodic_cache_root: ../WorldMM/output/memory/videomme_long_qwen3vl-8b/report_framework_index
  log_dir: logs

worldmm:
  granularities: [10sec, 30sec, 3min, 10min]   # WorldMM eval.py VIDEOMME_GRANULARITIES
  query_time: 123595999                        # eval.py QUERY_TIME = DAY1 23:59:59 → 전체 인덱싱
  metadata_model: qwen3vl-8b                   # 전처리(OpenIE/semantic)를 만든 모델명 = 파일 접미사
  text_embedding_model: Qwen/Qwen3-Embedding-4B
  episodic_cache_label: qwen3vl-8b             # 검색 서비스가 읽을 HippoRAG 캐시 라벨 (= 사전 인덱싱에 쓴 LLM 이름)

llm:
  backend: local          # local | openai
  local:
    worldmm_model: qwen3vl-8b       # in-process WorldMM LLMModel (사전 인덱싱 OpenIE)
    # OpenAI 호환 chat 엔드포인트: Deep-Reporter(planner/query/writer) + L1 episodic 필터가 공용으로 사용
    endpoint:
      server: hf                    # hf = local_llm_server.py (transformers) | vllm = 외부 `vllm serve` (같은 host/port로 교체)
      host: 127.0.0.1               # Deep-Reporter는 localhost/127.0.0.1 URL일 때 local-vLLM 방식(chat_template_kwargs)으로 호출
      port: 8010
      model: qwen3vl-8b             # hf: WorldMM 모델 키 / vllm: --served-model-name. 이름에 "qwen"이 있어야 Deep-Reporter가 QWEN_* env로 라우팅
      api_key: EMPTY
      default_max_tokens: 8192      # 요청에 max_tokens가 없을 때 (Deep-Reporter는 항상 8192를 보냄)
      max_tokens_cap: 3072          # P9(2026-10-25): 요청 max_tokens 상한. writer 반복 루프가 8,192토큰까지 가는 시간을 줄임. 정상 출력 최대 2,182(C-3–C-5 실측). 비우면 상한 없음
  openai:
    worldmm_model: gpt-5-mini       # OPENAI_API_KEY 필요 (키는 env로만, 이 파일에 저장 금지)
    endpoint:
      model: gpt-5-mini

retrieval:
  # L0: LLM 0회 (DSPy fact 필터·multiscale 필터 제외)
  # L1: 검색 요청(섹션)당 multiscale 필터 1회 (기본)
  # full: WorldMM 원래 episodic.retrieve (쿼리당 최대 5회)
  episodic_filter: L1
  rrf_k: 60                          # reciprocal rank fusion 상수 (쿼리·granularity별 순위 목록 병합)
  # L0/L1: (쿼리, granularity)마다 LLM 없이 그래프 검색해 모을 후보 수
  episodic_candidates_per_query: {10sec: 3, 30sec: 3, 3min: 2, 10min: 1}
  full_top_k_per_query: 3            # full: 쿼리마다 episodic.retrieve(final_top_k)
  episodic_k: 8                      # text 요청당 episodic 근거 수 (요청 topk가 상한)
  semantic_k_per_query: 5
  semantic_k: 4                      # text 요청당 semantic 근거 수 (남은 topk 안에서)
  visual_k_per_query: 3
  image_k: 4                         # image 요청당 프레임 근거 수 (요청 topk가 상한)
  filter_max_tokens: 512             # L1/full 필터 응답 최대 토큰 (캡션 ID JSON 배열)

service:
  host: 127.0.0.1
  port: 8020                         # Deep-Reporter retriever_url = http://127.0.0.1:8020/videos/<video_id>/search
  frames_dir: cache/frames           # {frames_dir}/{video_id}/{start_time}.jpg

report:
  domain: videomme                   # domain_templates.py 템플릿 세트
  text_topk: 20                      # Deep-Reporter text 검색 topk (검색 서비스에서 episodic_k + semantic_k 상한)
  image_topk: 10
  enable_filter: false               # Deep-Reporter filter 노드 (D9: off)
  overview_granularity: 10min        # planner 영상 개요로 쓰는 캡션 단위
  outputs_dir: outputs               # {outputs_dir}/{video_id}_{YYYYmmdd_HHMMSS}/
  deep_reporter_log_dir: logs/deep_reporter   # Deep-Reporter 세션 로그 (load_config가 절대경로로 바꿔 전달)
  previous_sections_context: written   # 결정 4 C0: written = 앞 섹션에서 실제로 쓴 문장(제목 + 단락 첫 문장, 인용 제거, 글자 수 상한)을 writer·query에 전달 / deep_reporter = 원래 동작(섹션 설명 + 본문 앞 100자)
  max_sections: 6                    # 결정 5: 결론 섹션 포함 전체 섹션 수 상한 (허용 3–15; 16 이상은 Deep-Reporter recursion_limit=50 초과로 보고서 전체 실패, 실측)
  translate_ko: false                # 한국어 번역본 report_ko.md 생성 on/off (기본 off, 2026-11-12). true면 영어 report.md 생성 후 섹션별 번역(검증 오류 시 생략, 결정 6)
  translation_max_tokens: 4096       # 섹션 번역 1회의 최대 출력 토큰
